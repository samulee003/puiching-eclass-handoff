<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>培正功課待辦看板</title>
<meta name="description" content="Checkable homework todos for Abigail (李悅) and Gloria (李昕)" />
<style>
  :root {
    --bg: #0c1218; --card: #15202e; --text: #f2f6fb; --muted: #93a4bc;
    --accent: #5aa7ff; --warn: #ffc14d; --ok: #3dd68c; --border: #2a3a50;
    /* Child colors distinct from accent blue */
    --child-yue: #20d3c2; --child-yue-soft: rgba(32, 211, 194, .22);
    --child-xin: #ff6b8a; --child-xin-soft: rgba(255, 107, 138, .22);
    --overdue: #ff5c4d; --overdue-soft: rgba(255, 92, 77, .16);
    --today: #ffd166; --today-soft: rgba(255, 209, 102, .18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", sans-serif;
    background:
      radial-gradient(900px 520px at 8% -8%, rgba(32, 211, 194, .16), transparent 55%),
      radial-gradient(800px 480px at 92% 0%, rgba(255, 107, 138, .14), transparent 50%),
      radial-gradient(1000px 600px at 50% 100%, rgba(90, 167, 255, .08), transparent 45%),
      var(--bg);
    color: var(--text); line-height: 1.45; padding: 20px 14px 80px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
  .actions a, button {
    text-decoration: none; background: #243247; color: var(--text); padding: 8px 12px;
    border-radius: 10px; border: 1px solid var(--border); font-size: 0.9rem; cursor: pointer;
  }
  button.primary { background: #1f4b8f; border-color: #2f6fd4; }
  button.ok { background: #1a4a34; border-color: #2f8a5a; }
  .grid { display: grid; gap: 14px; }
  @media (min-width: 800px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 14px 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    border-left: 4px solid var(--border);
  }
  .card[data-child-id="li-yue"] { border-left-color: var(--child-yue); }
  .card[data-child-id="li-xin"] { border-left-color: var(--child-xin); }
  .card h2 { margin: 0 0 6px; font-size: 1.1rem; }
  .card[data-child-id="li-yue"] h2 { color: var(--child-yue); }
  .card[data-child-id="li-xin"] h2 { color: var(--child-xin); }
  .card h2 span { color: var(--muted) !important; }
  .progress {
    height: 8px; background: #243247; border-radius: 99px; overflow: hidden; margin: 8px 0 12px;
  }
  .progress > i { display: block; height: 100%; background: var(--ok); width: 0%; transition: width .2s; }
  .card[data-child-id="li-yue"] .progress > i { background: linear-gradient(90deg, #0f9f93, var(--child-yue)); }
  .card[data-child-id="li-xin"] .progress > i { background: linear-gradient(90deg, #e5486a, var(--child-xin)); }
  .meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 8px; }
  h3 { margin: 12px 0 6px; font-size: 0.8rem; color: var(--warn); }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    border-top: 1px solid var(--border); padding: 10px 0; display: grid;
    grid-template-columns: 28px 1fr; gap: 8px; align-items: start;
    transition: background .2s, box-shadow .2s;
  }
  li:first-child { border-top: 0; }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  li.highlight {
    background: var(--today-soft); border-radius: 8px;
    box-shadow: inset 0 0 0 1px rgba(255, 209, 102, .45);
  }
  input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ok); }
  .title { font-weight: 600; }
  .row { color: var(--muted); font-size: 0.82rem; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: #243247; }
  .pill.must { background: #3a1f1f; color: #ffb4b4; }
  .pill.nosubmit { background: #3a2e14; color: var(--warn); }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #143528; color: var(--ok); border: 1px solid #2f8a5a;
    padding: 10px 14px; border-radius: 10px; display: none; z-index: 9;
  }
  footer { margin-top: 24px; color: var(--muted); font-size: 0.82rem; }
  a { color: var(--accent); }

  /* Tabs */
  .view-tabs {
    display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .view-tabs button {
    flex: 1; min-width: 120px; text-align: center; padding: 10px 14px;
    background: #1a2332; border-color: var(--border);
  }
  .view-tabs button.active {
    background: linear-gradient(135deg, #1f4b8f, #2563a8); border-color: #3d8bfd; font-weight: 600;
  }
  .view-panel { display: none; margin-bottom: 16px; }
  .view-panel.active { display: block; }
  .overview-card {
    background: linear-gradient(180deg, #182636 0%, var(--card) 40%);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .legend {
    display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 0.8rem;
    color: var(--muted); margin-bottom: 12px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(255,255,255,.08);
  }
  .legend .dot-yue { background: var(--child-yue); }
  .legend .dot-xin { background: var(--child-xin); }
  .legend .dot-overdue {
    background: transparent; border: 2px solid var(--overdue); border-radius: 50%;
    width: 11px; height: 11px; box-shadow: none;
  }
  .legend .dot-today {
    background: var(--today); border-radius: 2px; width: 12px; height: 8px;
  }

  /* Calendar */
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; gap: 8px;
  }
  .cal-header h2 { margin: 0; font-size: 1rem; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button { padding: 6px 10px; font-size: 0.85rem; min-width: 36px; }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
    font-size: 0.72rem; color: var(--muted); text-align: center; margin-bottom: 4px;
  }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
  }
  .cal-day {
    min-height: 54px; padding: 4px 3px; border-radius: 10px;
    border: 1px solid transparent; background: #101a27; cursor: pointer;
    display: flex; flex-direction: column; align-items: stretch;
    font-size: 0.78rem; transition: border-color .15s, background .15s, transform .12s;
  }
  .cal-day:hover { border-color: var(--border); background: #1a2738; transform: translateY(-1px); }
  .cal-day.other-month { opacity: .35; pointer-events: none; transform: none; }
  .cal-day.today {
    border-color: var(--today);
    background: var(--today-soft);
    box-shadow: inset 0 0 0 1px rgba(255, 209, 102, .35);
  }
  .cal-day.selected { background: #1f3350; border-color: var(--accent); }
  .cal-day.overdue-day { background: var(--overdue-soft); }
  .cal-day-num { font-weight: 700; text-align: center; line-height: 1.2; }
  .cal-day.today .cal-day-num { color: var(--today); }
  .cal-dots {
    display: flex; flex-wrap: wrap; gap: 3px; justify-content: center;
    margin-top: 4px; flex: 1; align-content: flex-start;
  }
  .cal-dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
  }
  .cal-dot.yue { background: var(--child-yue); }
  .cal-dot.xin { background: var(--child-xin); }
  .cal-dot.overdue {
    outline: 2px solid var(--overdue); outline-offset: 1px;
  }
  .cal-day-detail {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .cal-day-detail h3 { margin: 0 0 8px; font-size: 0.85rem; color: var(--text); }
  .cal-day-detail ul { margin: 0; }
  .cal-day-detail li {
    display: block; border: 0; padding: 6px 0; grid-template-columns: 1fr;
    border-bottom: 1px solid var(--border);
  }
  .cal-day-detail li:last-child { border-bottom: 0; }
  .cal-item-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cal-item-badge {
    font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600;
  }
  .cal-item-badge.yue { background: var(--child-yue-soft); color: var(--child-yue); }
  .cal-item-badge.xin { background: var(--child-xin-soft); color: var(--child-xin); }
  .cal-item-badge.overdue { background: var(--overdue-soft); color: var(--overdue); }

  /* Gantt */
  .gantt-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .gantt {
    min-width: 480px; position: relative; padding-bottom: 8px;
  }
  .gantt-body { margin-left: 108px; position: relative; }
  .gantt-axis {
    display: flex; border-bottom: 1px solid var(--border);
    margin-bottom: 6px; position: relative; height: 28px;
  }
  .gantt-axis-cell {
    flex: 1; min-width: 36px; text-align: center; font-size: 0.68rem;
    color: var(--muted); padding-top: 4px; border-left: 1px solid rgba(42,53,72,.5);
  }
  .gantt-axis-cell:first-child { border-left: 0; }
  .gantt-today-line {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: var(--today); z-index: 2; pointer-events: none;
  }
  .gantt-today-label {
    position: absolute; top: -2px; font-size: 0.65rem; color: var(--today);
    transform: translateX(-50%); white-space: nowrap; font-weight: 700;
  }
  .gantt-group { margin-bottom: 12px; }
  .gantt-group-title {
    font-size: 0.9rem; font-weight: 700; margin-bottom: 6px;
    padding-left: 8px; border-left: 3px solid currentColor;
  }
  .gantt-group-title.yue { color: var(--child-yue); }
  .gantt-group-title.xin { color: var(--child-xin); }
  .gantt-row {
    display: grid; grid-template-columns: 108px 1fr;
    align-items: center; min-height: 30px; margin-bottom: 4px;
  }
  .gantt-label {
    font-size: 0.72rem; color: var(--muted); padding-right: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.25;
  }
  .gantt-track {
    position: relative; height: 24px; background: #101a27;
    border-radius: 7px; overflow: visible;
  }
  .gantt-bar {
    position: absolute; top: 3px; height: 18px; border-radius: 5px;
    min-width: 8px; transition: opacity .2s;
  }
  .gantt-bar.yue {
    background: linear-gradient(90deg, #0f9f93, var(--child-yue));
  }
  .gantt-bar.xin {
    background: linear-gradient(90deg, #e5486a, var(--child-xin));
  }
  .gantt-bar.overdue {
    background: linear-gradient(90deg, #d9483b, var(--overdue));
    opacity: .95;
  }
  .gantt-bar.done { opacity: .28; }
  .gantt-bar-title {
    position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
    font-size: 0.65rem; color: #fff; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 8px);
    pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .gantt-empty { color: var(--muted); font-size: 0.85rem; padding: 8px 0; }
  .section-heading {
    font-size: 0.9rem; color: var(--muted); margin: 18px 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>培正功課待辦</h1>
    <div class="sub">勾選＝本機完成 · 按「清了」複製給 Grok 做閉環 · Agents 仍讀 status.json</div>
    <div class="actions">
      <button class="primary" id="btnCopyAll">複製今日「清了」給 Grok</button>
      <button id="btnReset">清除本機勾選</button>
      <a href="status.json">status.json</a>
      <a href="https://eclass.puiching.edu.mo/templates/" target="_blank" rel="noopener">開 eClass</a>
    </div>
    <div id="updated" class="sub"></div>

    <div class="view-tabs" role="tablist">
      <button type="button" class="active" data-tab="calendar" role="tab" aria-selected="true">日曆</button>
      <button type="button" data-tab="gantt" role="tab" aria-selected="false">時程甘特</button>
    </div>
    <div id="panel-calendar" class="view-panel active overview-card" role="tabpanel">
      <div id="calendar-root"><div class="sub">載入中…</div></div>
    </div>
    <div id="panel-gantt" class="view-panel overview-card" role="tabpanel">
      <div id="gantt-root"><div class="sub">載入中…</div></div>
    </div>

    <div class="section-heading">待辦清單</div>
    <div id="app" class="grid"><div class="card">載入中…</div></div>
    <footer>
      勾選存在此瀏覽器（localStorage），不會自動改 GitHub。<br />
      做完請按「清了」或回 Grok：「李悅清了」「李昕清了」。
    </footer>
  </div>
  <div class="toast" id="toast"></div>
<script>
const STORE_KEY = 'puiching-eclass-todos-v1';
const TZ = 'Asia/Macau';
const CHILD_COLORS = { 'li-yue': 'yue', 'li-xin': 'xin' };

function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; }
}
function saveStore(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
function itemKey(childId, section, it) {
  return [childId, section, it.due || '', it.subject || '', it.title || ''].join('|');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2200);
}

function todayMacau() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date());
}

function parseYmd(s) {
  if (!s) return null;
  const [y, m, d] = s.split('-').map(Number);
  if (!y || !m || !d) return null;
  return { y, m, d, iso: s };
}

function cmpYmd(a, b) {
  if (!a || !b) return 0;
  if (a.iso !== b.iso) return a.iso < b.iso ? -1 : 1;
  return 0;
}

function addDays(ymd, n) {
  const dt = new Date(Date.UTC(ymd.y, ymd.m - 1, ymd.d + n));
  const iso = dt.toISOString().slice(0, 10);
  const [y, m, d] = iso.split('-').map(Number);
  return { y, m, d, iso };
}

function daysBetween(a, b) {
  const t0 = Date.UTC(a.y, a.m - 1, a.d);
  const t1 = Date.UTC(b.y, b.m - 1, b.d);
  return Math.round((t1 - t0) / 86400000);
}

function shortTitle(it) {
  const t = it.title || '';
  return t.length > 22 ? t.slice(0, 20) + '…' : t;
}

function sectionItems(child) {
  return [
    ['due_today', '今日必做', child.due_today || []],
    ['due_soon', '近期必做', child.due_soon || []],
    ['tests_this_week', '本週測驗', child.tests_this_week || []],
    ['other', '其他', child.other || []]
  ];
}

function collectAllItems(data) {
  const out = [];
  for (const child of data.children || []) {
    for (const [sec, secLabel, items] of sectionItems(child)) {
      for (const it of items) {
        if (!it.due) continue;
        out.push({
          child, section: sec, sectionLabel: secLabel, item: it,
          key: itemKey(child.id, sec, it),
          due: parseYmd(it.due),
          childClass: CHILD_COLORS[child.id] || 'yue'
        });
      }
    }
  }
  return out;
}

function itemsByDate(allItems) {
  const map = {};
  for (const row of allItems) {
    const d = row.item.due;
    if (!map[d]) map[d] = [];
    map[d].push(row);
  }
  return map;
}

function renderItem(childId, section, it, store, onToggle) {
  const key = itemKey(childId, section, it);
  const done = !!store[key];
  const li = document.createElement('li');
  li.dataset.itemKey = key;
  li.dataset.due = it.due || '';
  li.dataset.childId = childId;
  if (done) li.classList.add('done');
  const must = it.submit_required === false
    ? '<span class="pill nosubmit">不須繳交</span>'
    : (it.submit_required ? '<span class="pill must">須繳交</span>' : '');
  li.innerHTML = `
    <input type="checkbox" ${done ? 'checked' : ''} aria-label="完成" />
    <div>
      <div class="title">${it.subject} · ${it.title}</div>
      <div class="row"><span>截止 ${it.due || '—'}</span>${must}${it.note ? `<span class="pill">${it.note}</span>` : ''}</div>
    </div>`;
  li.querySelector('input').addEventListener('change', (e) => onToggle(key, e.target.checked, li));
  return { li, key, done };
}

function childProgress(child, store) {
  let total = 0, done = 0;
  for (const [sec, , items] of sectionItems(child)) {
    for (const it of items) {
      total++;
      if (store[itemKey(child.id, sec, it)]) done++;
    }
  }
  return { total, done };
}

function isChildCleared(child, store) {
  const must = [...(child.due_today || []), ...(child.due_soon || [])];
  if (!must.length) return [...(child.tests_this_week || [])].every(it => store[itemKey(child.id, 'tests_this_week', it)]);
  return must.every(it => {
    const sec = (child.due_today || []).includes(it) ? 'due_today' : 'due_soon';
    return store[itemKey(child.id, sec, it)];
  });
}

function highlightItemsForDate(iso) {
  document.querySelectorAll('li.highlight').forEach(el => el.classList.remove('highlight'));
  if (!iso) return;
  const matches = document.querySelectorAll(`li[data-due="${iso}"]`);
  if (!matches.length) return;
  matches.forEach(el => el.classList.add('highlight'));
  matches[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
}

let calState = { year: 0, month: 0, selected: null };

function renderCalendar(data, store) {
  const root = document.getElementById('calendar-root');
  const today = parseYmd(todayMacau());
  const allItems = collectAllItems(data);
  const byDate = itemsByDate(allItems);

  if (!calState.year) {
    calState.year = today.y;
    calState.month = today.m;
  }

  const firstOfMonth = { y: calState.year, m: calState.month, d: 1, iso: '' };
  firstOfMonth.iso = `${calState.year}-${String(calState.month).padStart(2,'0')}-01`;
  const startWeekday = new Date(Date.UTC(calState.year, calState.month - 1, 1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(calState.year, calState.month, 0)).getUTCDate();

  const monthLabel = new Intl.DateTimeFormat('zh-Hant', {
    timeZone: TZ, year: 'numeric', month: 'long'
  }).format(new Date(Date.UTC(calState.year, calState.month - 1, 15)));

  let html = `
    <div class="legend">
      <span><i class="dot-yue"></i>李悅</span>
      <span><i class="dot-xin"></i>李昕</span>
      <span><i class="dot-overdue"></i>已逾期</span>
      <span><i class="dot-today"></i>今日</span>
    </div>
    <div class="cal-header">
      <h2>${monthLabel}</h2>
      <div class="cal-nav">
        <button type="button" id="calPrev" aria-label="上月">‹</button>
        <button type="button" id="calToday" aria-label="本月">今日</button>
        <button type="button" id="calNext" aria-label="下月">›</button>
      </div>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span>
      <span>四</span><span>五</span><span>六</span>
    </div>
    <div class="cal-grid">`;

  const gridStart = addDays(firstOfMonth, -startWeekday);
  for (let i = 0; i < 42; i++) {
    const cell = addDays(gridStart, i);
    const inMonth = cell.m === calState.month && cell.y === calState.year;
    const dayItems = byDate[cell.iso] || [];
    const isToday = cell.iso === today.iso;
    const isOverdue = cmpYmd(cell, today) < 0 && dayItems.length;
    const isSelected = calState.selected === cell.iso;
    const classes = ['cal-day'];
    if (!inMonth) classes.push('other-month');
    if (isToday) classes.push('today');
    if (isSelected) classes.push('selected');
    if (isOverdue) classes.push('overdue-day');

    const dots = dayItems.map(row => {
      const overdue = cmpYmd(row.due, today) < 0 && !store[row.key];
      return `<span class="cal-dot ${row.childClass}${overdue ? ' overdue' : ''}" title="${row.child.zh}"></span>`;
    }).join('');

    html += `<button type="button" class="${classes.join(' ')}" data-date="${cell.iso}" ${inMonth ? '' : 'tabindex="-1"'}>
      <span class="cal-day-num">${cell.d}</span>
      <span class="cal-dots">${dots}</span>
    </button>`;
  }
  html += '</div>';

  if (calState.selected && byDate[calState.selected]) {
    const selItems = byDate[calState.selected];
    const selOverdue = cmpYmd(parseYmd(calState.selected), today) < 0;
    html += `<div class="cal-day-detail">
      <h3>${calState.selected}${selOverdue ? ' <span class="cal-item-badge overdue">已逾期</span>' : ''}</h3>
      <ul>`;
    for (const row of selItems) {
      const done = !!store[row.key];
      const overdue = cmpYmd(row.due, today) < 0 && !done;
      html += `<li>
        <div class="cal-item-row">
          <span class="cal-item-badge ${row.childClass}">${row.child.zh}</span>
          ${overdue ? '<span class="cal-item-badge overdue">逾期</span>' : ''}
          ${done ? '<span class="pill">已完成</span>' : ''}
        </div>
        <div class="title" style="font-size:.85rem;margin-top:2px">${row.item.subject} · ${row.item.title}</div>
        <div class="row"><span>${row.sectionLabel}</span></div>
      </li>`;
    }
    html += '</ul><button type="button" class="primary" id="calJumpList" style="margin-top:8px">跳至待辦清單</button></div>';
  } else if (calState.selected) {
    html += `<div class="cal-day-detail"><div class="sub">此日無功課項目</div></div>`;
  }

  root.innerHTML = html;

  root.querySelector('#calPrev')?.addEventListener('click', () => {
    calState.month--;
    if (calState.month < 1) { calState.month = 12; calState.year--; }
    renderCalendar(data, loadStore());
  });
  root.querySelector('#calNext')?.addEventListener('click', () => {
    calState.month++;
    if (calState.month > 12) { calState.month = 1; calState.year++; }
    renderCalendar(data, loadStore());
  });
  root.querySelector('#calToday')?.addEventListener('click', () => {
    calState.year = today.y;
    calState.month = today.m;
    calState.selected = today.iso;
    renderCalendar(data, loadStore());
    highlightItemsForDate(today.iso);
  });
  root.querySelectorAll('.cal-day:not(.other-month)').forEach(btn => {
    btn.addEventListener('click', () => {
      calState.selected = btn.dataset.date;
      renderCalendar(data, loadStore());
      highlightItemsForDate(calState.selected);
    });
  });
  root.querySelector('#calJumpList')?.addEventListener('click', () => {
    highlightItemsForDate(calState.selected);
  });
}

function renderGantt(data, store) {
  const root = document.getElementById('gantt-root');
  const today = parseYmd(todayMacau());
  const allItems = collectAllItems(data)
    .filter(row => row.due && daysBetween(today, row.due) <= 120)
    .sort((a, b) => cmpYmd(a.due, b.due) || a.child.zh.localeCompare(b.child.zh, 'zh-Hant'));

  if (!allItems.length) {
    root.innerHTML = '<div class="gantt-empty">暫無可顯示的截止日期</div>';
    return;
  }

  let rangeStart = today;
  let rangeEnd = today;
  for (const row of allItems) {
    if (cmpYmd(row.due, rangeEnd) > 0) rangeEnd = row.due;
    if (cmpYmd(row.due, rangeStart) < 0) rangeStart = row.due;
  }
  const spanDays = Math.max(daysBetween(rangeStart, rangeEnd), 7);
  const totalDays = spanDays + 1;

  const axisCells = [];
  for (let i = 0; i <= spanDays; i++) {
    const d = addDays(rangeStart, i);
    axisCells.push(`<div class="gantt-axis-cell">${d.m}/${d.d}</div>`);
  }

  const todayOffset = Math.max(0, Math.min(spanDays, daysBetween(rangeStart, today)));
  const todayPct = (todayOffset / spanDays) * 100;

  let groupsHtml = '';
  for (const child of data.children || []) {
    const rows = allItems.filter(r => r.child.id === child.id);
    if (!rows.length) continue;
    const cls = CHILD_COLORS[child.id] || 'yue';
    groupsHtml += `<div class="gantt-group">
      <div class="gantt-group-title ${cls}">${child.zh}</div>`;
    for (const row of rows) {
      const done = !!store[row.key];
      const overdue = cmpYmd(row.due, today) < 0;
      let barStart, barEnd;
      if (overdue) {
        barEnd = row.due;
        barStart = addDays(row.due, -2);
        if (cmpYmd(barStart, rangeStart) < 0) barStart = rangeStart;
      } else {
        barStart = today;
        barEnd = row.due;
        if (cmpYmd(barStart, rangeStart) < 0) barStart = rangeStart;
      }
      const left = (daysBetween(rangeStart, barStart) / spanDays) * 100;
      const width = Math.max((daysBetween(barStart, barEnd) / spanDays) * 100, 1.5);
      const label = `${row.item.subject} · ${shortTitle(row.item)}`;
      groupsHtml += `
        <div class="gantt-row">
          <div class="gantt-label" title="${row.item.title}">${label}</div>
          <div class="gantt-track">
            <div class="gantt-bar ${cls}${overdue ? ' overdue' : ''}${done ? ' done' : ''}"
              style="left:${left}%;width:${width}%">
              <span class="gantt-bar-title">${label}</span>
            </div>
          </div>
        </div>`;
    }
    groupsHtml += '</div>';
  }

  root.innerHTML = `
    <div class="legend">
      <span><i class="dot-yue"></i>李悅</span>
      <span><i class="dot-xin"></i>李昕</span>
      <span><i class="dot-overdue"></i>已逾期</span>
      <span><i class="dot-today"></i>今日</span>
    </div>
    <div class="gantt-wrap">
      <div class="gantt">
        <div class="gantt-body">
          <div class="gantt-today-line" style="left:${todayPct}%">
            <span class="gantt-today-label">今日</span>
          </div>
          <div class="gantt-axis">${axisCells.join('')}</div>
          ${groupsHtml}
        </div>
      </div>
    </div>`;
}

function refreshViews(data) {
  const store = loadStore();
  renderCalendar(data, store);
  renderGantt(data, store);
}

function setupTabs() {
  const tabs = document.querySelectorAll('.view-tabs button');
  const panels = {
    calendar: document.getElementById('panel-calendar'),
    gantt: document.getElementById('panel-gantt')
  };
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.tab;
      tabs.forEach(t => {
        t.classList.toggle('active', t === btn);
        t.setAttribute('aria-selected', t === btn ? 'true' : 'false');
      });
      Object.entries(panels).forEach(([k, el]) => el.classList.toggle('active', k === id));
    });
  });
}

async function load() {
  const app = document.getElementById('app');
  const store = loadStore();
  try {
    const res = await fetch('status.json?ts=' + Date.now());
    const data = await res.json();
    window.__DATA = data;
    document.getElementById('updated').textContent =
      '更新：' + (data.updated_at || '—') + ' · ' + (data.timezone || TZ);
    refreshViews(data);
    app.innerHTML = '';
    for (const child of data.children || []) {
      const card = document.createElement('section');
      card.className = 'card';
      card.dataset.childId = child.id;
      const { total, done } = childProgress(child, store);
      const pct = total ? Math.round(done * 100 / total) : 0;
      card.innerHTML = `
        <h2>${child.zh} <span style="font-weight:500;color:#8b9bb4">／ ${child.en} · ${child.grade}</span></h2>
        <div class="meta"><span class="doneCount">${done}</span>／${total} 完成 · 負責人 ${child.owner || '—'}</div>
        <div class="progress"><i style="width:${pct}%"></i></div>
        <div class="actions" style="margin:0 0 8px">
          <button class="ok btnChildClear" type="button">複製「${child.zh}清了」</button>
        </div>`;
      const progressBar = card.querySelector('.progress > i');
      const doneCount = card.querySelector('.doneCount');
      const refreshProg = () => {
        const s = loadStore();
        const p = childProgress(child, s);
        doneCount.textContent = p.done;
        progressBar.style.width = (p.total ? Math.round(p.done * 100 / p.total) : 0) + '%';
        if (window.__DATA) refreshViews(window.__DATA);
      };
      const onToggle = (key, checked, li) => {
        const s = loadStore();
        if (checked) s[key] = true; else delete s[key];
        saveStore(s);
        li.classList.toggle('done', checked);
        refreshProg();
      };
      for (const [sec, label, items] of sectionItems(child)) {
        if (!items.length) continue;
        const h = document.createElement('h3');
        h.textContent = label;
        card.appendChild(h);
        const ul = document.createElement('ul');
        for (const it of items) ul.appendChild(renderItem(child.id, sec, it, store, onToggle).li);
        card.appendChild(ul);
      }
      card.querySelector('.btnChildClear').addEventListener('click', async () => {
        const text = child.zh + '清了';
        await navigator.clipboard.writeText(text);
        toast('已複製：' + text + ' — 貼給 Grok');
      });
      app.appendChild(card);
    }
  } catch (e) {
    app.innerHTML = `<div class="card">讀不到 status.json：${e.message}</div>`;
    document.getElementById('calendar-root').innerHTML = `<div class="sub">載入失敗</div>`;
    document.getElementById('gantt-root').innerHTML = `<div class="sub">載入失敗</div>`;
  }
}

document.getElementById('btnCopyAll').addEventListener('click', async () => {
  const data = window.__DATA; if (!data) return;
  const store = loadStore();
  const lines = [];
  for (const child of data.children || []) {
    if (isChildCleared(child, store)) lines.push(child.zh + '清了');
    else {
      const open = [];
      for (const it of [...(child.due_today || [])]) {
        if (!store[itemKey(child.id, 'due_today', it)]) open.push(it.title);
      }
      for (const it of [...(child.due_soon || [])]) {
        if (!store[itemKey(child.id, 'due_soon', it)]) open.push(it.title);
      }
      lines.push(child.zh + (open.length ? '未清：' + open.join('；') : '無今日項'));
    }
  }
  const text = lines.join('\n');
  await navigator.clipboard.writeText(text);
  toast('已複製給 Grok');
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (!confirm('清除此瀏覽器全部勾選？')) return;
  localStorage.removeItem(STORE_KEY);
  load();
  toast('已清除本機勾選');
});

setupTabs();
load();
</script>
