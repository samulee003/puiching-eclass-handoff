<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>培正功課待辦看板</title>
<meta name="description" content="Checkable homework todos for Abigail (李悅) and Gloria (李昕)" />
<style>
  :root {
    --bg: #090d16;
    --card: #121927;
    --card-hover: #172133;
    --card-glass: rgba(18, 25, 39, 0.88);
    --border: rgba(255, 255, 255, 0.08);
    --border-light: rgba(255, 255, 255, 0.14);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --subtle: #64748b;
    --accent: #3b82f6;
    --accent-soft: rgba(59, 130, 246, 0.15);
    --warn: #f59e0b;
    --warn-soft: rgba(245, 158, 11, 0.15);
    --ok: #10b981;
    --ok-soft: rgba(16, 185, 129, 0.15);
    --child-yue: #3b82f6;
    --child-yue-grad: linear-gradient(135deg, #2563eb, #60a5fa);
    --child-xin: #ec4899;
    --child-xin-grad: linear-gradient(135deg, #db2777, #f472b6);
    --overdue: #f43f5e;
    --upcoming: #10b981;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Noto Sans TC", sans-serif;
    background-color: var(--bg);
    background-image: 
      radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.14) 0px, transparent 55%),
      radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.10) 0px, transparent 50%),
      radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.06) 0px, transparent 50%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.5;
    padding: 24px 16px calc(80px + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  
  /* Topbar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
    padding: 16px 20px;
    background: var(--card-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
  }
  .topbar-brand { display: flex; flex-direction: column; gap: 4px; }
  h1 {
    font-size: 1.4rem; font-weight: 800; margin: 0;
    letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .brand-badge {
    font-size: 0.72rem; font-weight: 700;
    padding: 2px 8px; border-radius: 6px;
    background: rgba(59, 130, 246, 0.2); color: #60a5fa;
    border: 1px solid rgba(59, 130, 246, 0.3);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .sub {
    color: var(--muted); font-size: 0.82rem; font-weight: 500;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .sub .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); box-shadow: 0 0 8px var(--ok);
    animation: pulse-dot 2s infinite ease-in-out;
  }
  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: 0.6; }
  }

  /* Buttons & Actions */
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .actions a, button {
    font-family: inherit; text-decoration: none;
    background: #1e293b; color: var(--text); padding: 9px 15px;
    border-radius: 11px; border: 1px solid var(--border);
    font-size: 0.86rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .actions a:hover, button:hover {
    background: #283548; border-color: var(--border-light);
    transform: translateY(-1px);
  }
  .actions a:active, button:active {
    transform: translateY(1px);
  }
  button.primary {
    background: linear-gradient(135deg, #1d4ed8, #2563eb);
    border-color: #3b82f6; color: #fff;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  }
  button.primary:hover {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
  }
  button.ok {
    background: linear-gradient(135deg, #059669, #10b981);
    border-color: #34d399; color: #fff;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }
  button.ok:hover {
    background: linear-gradient(135deg, #10b981, #34d399);
  }
  .child-link {
    font-weight: 700; font-size: 0.8rem; padding: 5px 12px; border-radius: 99px;
    letter-spacing: 0.02em; transition: all 0.2s;
  }
  .child-link.yue {
    background: rgba(59, 130, 246, 0.18); border-color: rgba(59, 130, 246, 0.4);
    color: #93c5fd;
  }
  .child-link.yue:hover {
    background: rgba(59, 130, 246, 0.32); color: #fff;
  }
  .child-link.xin {
    background: rgba(236, 72, 153, 0.18); border-color: rgba(236, 72, 153, 0.4);
    color: #f9a8d4;
  }
  .child-link.xin:hover {
    background: rgba(236, 72, 153, 0.32); color: #fff;
  }

  /* Grid and Child Cards */
  .grid { display: grid; gap: 18px; margin-bottom: 22px; }
  @media (min-width: 800px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    background: var(--card-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px 18px 14px;
    box-shadow: 0 12px 32px -6px rgba(0, 0, 0, 0.35);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    border-color: var(--border-light);
    box-shadow: 0 16px 40px -6px rgba(0, 0, 0, 0.45);
  }
  .card[data-child-id="li-yue"]::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--child-yue-grad);
  }
  .card[data-child-id="li-xin"]::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--child-xin-grad);
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 6px;
  }
  .card-head h2 {
    margin: 0; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 8px;
  }
  .meta {
    color: var(--muted); font-size: 0.84rem; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .doneCount { color: var(--text); font-weight: 800; font-size: 1.05rem; }

  .progress {
    height: 10px; background: rgba(255, 255, 255, 0.08); border-radius: 99px;
    overflow: hidden; margin: 4px 0 14px; position: relative;
  }
  .progress > i {
    display: block; height: 100%; border-radius: 99px;
    width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    background: linear-gradient(90deg, #10b981, #34d399);
  }
  .card[data-child-id="li-yue"] .progress > i {
    background: linear-gradient(90deg, #2563eb, #38bdf8);
  }
  .card[data-child-id="li-xin"] .progress > i {
    background: linear-gradient(90deg, #db2777, #f472b6);
  }

  /* Section Groups & Items */
  h3 {
    margin: 16px 0 8px; font-size: 0.84rem; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: #cbd5e1; display: flex; align-items: center; gap: 6px;
  }
  h3::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn); display: inline-block;
  }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  li {
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 12px; padding: 10px 12px;
    display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  li:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.1);
    transform: translateX(2px);
  }
  li.done {
    background: rgba(255, 255, 255, 0.01);
    border-color: transparent;
    opacity: 0.62;
  }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  li.highlight {
    background: rgba(59, 130, 246, 0.16);
    border-color: rgba(59, 130, 246, 0.5);
    box-shadow: 0 0 16px rgba(59, 130, 246, 0.25);
  }
  input[type=checkbox] {
    width: 19px; height: 19px; cursor: pointer;
    accent-color: var(--ok); border-radius: 6px;
    margin-top: 2px; flex-shrink: 0;
  }
  .title {
    font-weight: 700; font-size: 0.92rem; color: var(--text);
    line-height: 1.35; word-break: break-word;
  }
  .row {
    color: var(--muted); font-size: 0.78rem; font-weight: 500;
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center;
  }
  .pill {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.08); color: var(--muted);
  }
  .pill.must {
    background: rgba(244, 63, 94, 0.18); color: #fda4af;
    border: 1px solid rgba(244, 63, 94, 0.3);
  }
  .pill.nosubmit {
    background: rgba(245, 158, 11, 0.16); color: #fde68a;
    border: 1px solid rgba(245, 158, 11, 0.25);
  }
  details.more {
    margin-top: 14px; color: var(--muted); font-size: 0.85rem;
    background: rgba(255, 255, 255, 0.02); border-radius: 12px;
    border: 1px dashed rgba(255, 255, 255, 0.1); padding: 8px 12px;
  }
  details.more summary {
    cursor: pointer; padding: 4px 0; font-weight: 700; color: #cbd5e1;
  }
  details.more ul { margin-top: 8px; }

  /* Time-Fold: Tabs & View Panels */
  .time-fold {
    margin-top: 24px; background: var(--card-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 18px; padding: 6px 18px 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }
  .time-fold > summary {
    cursor: pointer; list-style: none; padding: 14px 0 10px;
    color: var(--text); font-size: 1rem; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between;
  }
  .time-fold > summary::-webkit-details-marker { display: none; }
  .time-fold > summary::after {
    content: "▾"; font-size: 1.1rem; color: var(--muted);
    transition: transform 0.2s;
  }
  .time-fold:not([open]) > summary::after { transform: rotate(-90deg); }
  .time-fold .view-tabs { margin-top: 6px; }

  .view-tabs {
    display: inline-flex; background: rgba(0, 0, 0, 0.25);
    padding: 4px; border-radius: 12px; border: 1px solid var(--border);
    gap: 4px; margin-bottom: 16px; width: 100%;
  }
  .view-tabs button {
    flex: 1; padding: 8px 16px; border-radius: 9px;
    background: transparent; border: none; color: var(--muted);
    font-weight: 600; font-size: 0.88rem; cursor: pointer;
    transition: all 0.15s ease;
  }
  .view-tabs button.active {
    background: #2563eb; color: #fff; font-weight: 700;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
  }
  .view-panel { display: none; margin-bottom: 16px; }
  .view-panel.active { display: block; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 12px 18px; font-size: 0.8rem;
    color: var(--muted); margin-bottom: 14px; align-items: center;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  }
  .legend .dot-yue { background: var(--child-yue); }
  .legend .dot-xin { background: var(--child-xin); }
  .legend .dot-overdue { background: var(--overdue); border-radius: 2px; width: 12px; height: 8px; }
  .legend .dot-upcoming { background: var(--upcoming); border-radius: 2px; width: 12px; height: 8px; }

  /* Calendar */
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; gap: 8px;
  }
  .cal-header h2 { margin: 0; font-size: 1.05rem; font-weight: 800; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button {
    padding: 6px 12px; font-size: 0.82rem; font-weight: 600;
    border-radius: 8px; background: rgba(255, 255, 255, 0.05);
  }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    font-size: 0.74rem; font-weight: 700; color: var(--muted);
    text-align: center; margin-bottom: 6px;
  }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .cal-day {
    min-height: 56px; padding: 5px 3px; border-radius: 10px;
    border: 1px solid transparent; background: rgba(255, 255, 255, 0.025);
    cursor: pointer; display: flex; flex-direction: column; align-items: stretch;
    font-size: 0.8rem; transition: border-color .15s, background .15s;
  }
  .cal-day:hover { border-color: var(--border-light); background: rgba(255, 255, 255, 0.07); }
  .cal-day.other-month { opacity: .28; pointer-events: none; }
  .cal-day.today {
    border-color: var(--accent); background: rgba(59, 130, 246, 0.12);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .cal-day.selected { background: rgba(59, 130, 246, 0.25); border-color: #60a5fa; }
  .cal-day.overdue-day { background: rgba(244, 63, 94, 0.1); }
  .cal-day-num { font-weight: 700; text-align: center; line-height: 1.2; }
  .cal-dots {
    display: flex; flex-wrap: wrap; gap: 3px; justify-content: center;
    margin-top: 4px; flex: 1; align-content: flex-start;
  }
  .cal-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .cal-dot.yue { background: var(--child-yue); }
  .cal-dot.xin { background: var(--child-xin); }
  .cal-dot.overdue { box-shadow: 0 0 0 1px var(--overdue); }
  .cal-day-detail {
    margin-top: 14px; padding: 12px 14px; border-radius: 12px;
    background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .cal-day-detail h3 { margin: 0 0 8px; font-size: 0.85rem; color: var(--text); }
  .cal-day-detail h3::before { display: none; }
  .cal-day-detail ul { margin: 0; }
  .cal-day-detail li {
    display: block; border: 0; padding: 6px 0; grid-template-columns: 1fr;
    border-bottom: 1px solid var(--border); border-radius: 0; background: transparent;
  }
  .cal-day-detail li:last-child { border-bottom: 0; }
  .cal-item-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cal-item-badge {
    font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 700;
  }
  .cal-item-badge.yue { background: rgba(59, 130, 246, 0.22); color: #93c5fd; }
  .cal-item-badge.xin { background: rgba(236, 72, 153, 0.22); color: #f9a8d4; }
  .cal-item-badge.overdue { background: rgba(244, 63, 94, 0.22); color: #fda4af; }

  /* Gantt */
  .gantt-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-top: 4px; }
  .gantt { min-width: 480px; position: relative; padding-bottom: 8px; }
  .gantt-body { margin-left: 112px; position: relative; }
  .gantt-axis {
    display: flex; border-bottom: 1px solid var(--border);
    margin-bottom: 8px; position: relative; height: 28px;
  }
  .gantt-axis-cell {
    flex: 1; min-width: 36px; text-align: center; font-size: 0.68rem; font-family: ui-monospace, "SF Mono", monospace;
    color: var(--muted); padding-top: 4px; border-left: 1px solid rgba(255, 255, 255, 0.05);
  }
  .gantt-axis-cell:first-child { border-left: 0; }
  .gantt-today-line {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: #38bdf8; z-index: 2; pointer-events: none;
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
  }
  .gantt-today-label {
    position: absolute; top: -3px; font-size: 0.65rem; color: #38bdf8;
    transform: translateX(-50%); white-space: nowrap; font-weight: 700;
    background: rgba(15, 23, 42, 0.9); padding: 1px 4px; border-radius: 4px;
    border: 1px solid rgba(56, 189, 248, 0.4);
  }
  .gantt-group { margin-bottom: 14px; }
  .gantt-group-title {
    font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;
    padding-left: 4px;
  }
  .gantt-group-title.yue { color: #60a5fa; }
  .gantt-group-title.xin { color: #f472b6; }
  .gantt-row {
    display: grid; grid-template-columns: 112px 1fr;
    align-items: center; min-height: 30px; margin-bottom: 5px;
  }
  .gantt-label {
    font-size: 0.74rem; font-weight: 600; color: var(--muted); padding-right: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.25;
  }
  .gantt-track {
    position: relative; height: 22px; background: rgba(0, 0, 0, 0.3);
    border-radius: 6px; overflow: visible;
  }
  .gantt-bar {
    position: absolute; top: 3px; height: 16px; border-radius: 5px;
    min-width: 6px; transition: opacity .2s;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
  }
  .gantt-bar.yue { background: var(--child-yue-grad); }
  .gantt-bar.xin { background: var(--child-xin-grad); }
  .gantt-bar.overdue { background: var(--overdue); opacity: .9; }
  .gantt-bar.done { opacity: .25; }
  .gantt-empty { color: var(--muted); font-size: 0.85rem; padding: 8px 0; }

  /* Footer & Sync Fold */
  footer {
    margin-top: 24px; color: var(--muted); font-size: 0.8rem;
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  }
  footer a, footer button { font-size: 0.8rem; padding: 6px 12px; }
  .sync-fold {
    width: 100%; background: var(--card-glass);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 4px 14px 12px; margin-top: 8px;
  }
  .sync-fold > summary {
    cursor: pointer; padding: 10px 0 6px; font-weight: 700;
    color: var(--muted); font-size: 0.86rem; list-style: none;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sync-fold > summary::-webkit-details-marker { display: none; }
  .sync-fold > summary::after { content: "▾"; font-size: 1rem; color: var(--muted); }
  .sync-fold:not([open]) > summary::after { transform: rotate(-90deg); }
  .sync-panel { font-size: 0.82rem; }
  .sync-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sync-state {
    padding: 3px 10px; border-radius: 99px; background: #1e293b;
    color: var(--muted); font-size: 0.74rem; font-weight: 700; white-space: nowrap;
  }
  .sync-state.connected { background: rgba(16, 185, 129, 0.2); color: #34d399; }
  .sync-state.local { background: rgba(255, 255, 255, 0.08); color: var(--muted); }
  .sync-state.connecting { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
  .sync-state.offline { background: rgba(244, 63, 94, 0.2); color: #f87171; }
  .sync-copy, .sync-message { color: var(--muted); font-size: 0.78rem; margin-top: 6px; }
  .sync-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .sync-controls label { color: var(--muted); font-size: 0.78rem; font-weight: 600; }
  .sync-controls input {
    background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px; padding: 8px 12px;
    font-size: 0.82rem; min-width: 220px; font-family: ui-monospace, monospace;
  }
  .sync-controls input:focus { outline: none; border-color: var(--accent); }
  .sync-controls button { padding: 8px 12px; font-size: 0.78rem; }
  .sync-pairing-section { margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 14px; }
  .sync-child-card {
    background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
  }
  .sync-child-actions button { padding: 6px 12px; font-size: 0.78rem; border-radius: 8px; }
  .sync-qr-container svg { display: block; margin: 0 auto; max-width: 100%; height: auto; border-radius: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: rgba(16, 185, 129, 0.95); color: #ffffff;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    font-weight: 700; font-size: 0.9rem;

<script>
const STORE_KEY = 'puiching-eclass-todos-v1';
const POINTS_KEY = 'puiching-eclass-points-v1';
const TZ = 'Asia/Macau';
const CHILD_COLORS = { 'li-yue': 'yue', 'li-xin': 'xin' };

function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; }
}
function saveStore(s) {
  localStorage.setItem(STORE_KEY, JSON.stringify(s));
  try { window.PuichingSync && window.PuichingSync.replaceTodos(s); } catch {}
}
function loadPoints() {
  try { return JSON.parse(localStorage.getItem(POINTS_KEY) || '{}'); } catch { return {}; }
}
function savePoints(p) {
  localStorage.setItem(POINTS_KEY, JSON.stringify(p));
  try { window.PuichingSync && window.PuichingSync.replacePoints(p); } catch {}
}
function itemKey(childId, section, it) {
  return [childId, section, it.due || '', it.subject || '', it.title || ''].join('|');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2200);
}

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (err) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (err) {
    return false;
  }
}

function todayMacau() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date());
}

function formatUpdated(iso) {
  if (!iso) return '尚未更新';
  try {
    const d = new Date(iso);
    const date = new Intl.DateTimeFormat('zh-Hant', {
      timeZone: TZ, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
    }).format(d);
    return '更新 ' + date;
  } catch {
    return '更新 ' + iso;
  }
}

function parseYmd(s) {
  if (!s) return null;
  const [y, m, d] = s.split('-').map(Number);
  if (!y || !m || !d) return null;
  return { y, m, d, iso: s };
}

function cmpYmd(a, b) {
  if (!a || !b) return 0;
  if (a.iso !== b.iso) return a.iso < b.iso ? -1 : 1;
  return 0;
}

function addDays(ymd, n) {
  const dt = new Date(Date.UTC(ymd.y, ymd.m - 1, ymd.d + n));
  const iso = dt.toISOString().slice(0, 10);
  const [y, m, d] = iso.split('-').map(Number);
  return { y, m, d, iso };
}

function daysBetween(a, b) {
  const t0 = Date.UTC(a.y, a.m - 1, a.d);
  const t1 = Date.UTC(b.y, b.m - 1, b.d);
  return Math.round((t1 - t0) / 86400000);
}

function shortTitle(it) {
  const t = it.title || '';
  return t.length > 22 ? t.slice(0, 20) + '…' : t;
}

function sectionItems(child) {
  return [
    ['due_today', '今日必做', child.due_today || []],
    ['due_soon', '近期必做', child.due_soon || []],
    ['tests_this_week', '本週測驗', child.tests_this_week || []],
    ['other', '其他', child.other || []]
  ];
}

function collectAllItems(data) {
  const out = [];
  for (const child of data.children || []) {
    for (const [sec, secLabel, items] of sectionItems(child)) {
      for (const it of items) {
        if (!it.due) continue;
        out.push({
          child, section: sec, sectionLabel: secLabel, item: it,
          key: itemKey(child.id, sec, it),
          due: parseYmd(it.due),
          childClass: CHILD_COLORS[child.id] || 'yue'
        });
      }
    }
  }
  return out;
}

function itemsByDate(allItems) {
  const map = {};
  for (const row of allItems) {
    const d = row.item.due;
    if (!map[d]) map[d] = [];
    map[d].push(row);
  }
  return map;
}

function renderItem(childId, section, it, store, onToggle) {
  const key = itemKey(childId, section, it);
  const done = !!store[key];
  const li = document.createElement('li');
  li.dataset.itemKey = key;
  li.dataset.due = it.due || '';
  li.dataset.childId = childId;
  if (done) li.classList.add('done');
  const must = it.submit_required === false
    ? '<span class="pill nosubmit">不須繳交</span>'
    : (it.submit_required ? '<span class="pill must">須繳交</span>' : '');
  li.innerHTML = `
    <input type="checkbox" ${done ? 'checked' : ''} aria-label="完成" />
    <div>
      <div class="title">${it.subject} · ${it.title}</div>
      <div class="row"><span>截止 ${it.due || '—'}</span>${must}${it.note ? `<span class="pill">${it.note}</span>` : ''}</div>
    </div>`;
  li.querySelector('input').addEventListener('change', (e) => onToggle(key, e.target.checked, li));
  return { li, key, done };
}

function childProgress(child, store) {
  let total = 0, done = 0;
  for (const [sec, , items] of sectionItems(child)) {
    for (const it of items) {
      total++;
      if (store[itemKey(child.id, sec, it)]) done++;
    }
  }
  return { total, done };
}

function isChildCleared(child, store) {
  const must = [...(child.due_today || []), ...(child.due_soon || [])];
  if (!must.length) return [...(child.tests_this_week || [])].every(it => store[itemKey(child.id, 'tests_this_week', it)]);
  return must.every(it => {
    const sec = (child.due_today || []).includes(it) ? 'due_today' : 'due_soon';
    return store[itemKey(child.id, sec, it)];
  });
}

function highlightItemsForDate(iso) {
  document.querySelectorAll('li.highlight').forEach(el => el.classList.remove('highlight'));
  if (!iso) return;
  const matches = document.querySelectorAll(`li[data-due="${iso}"]`);
  if (!matches.length) return;
  matches.forEach(el => el.classList.add('highlight'));
  matches[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
}

let calState = { year: 0, month: 0, selected: null };

function renderCalendar(data, store) {
  const root = document.getElementById('calendar-root');
  const today = parseYmd(todayMacau());
  const allItems = collectAllItems(data);
  const byDate = itemsByDate(allItems);

  if (!calState.year) {
    calState.year = today.y;
    calState.month = today.m;
  }

  const firstOfMonth = { y: calState.year, m: calState.month, d: 1, iso: '' };
  firstOfMonth.iso = `${calState.year}-${String(calState.month).padStart(2,'0')}-01`;
  const startWeekday = new Date(Date.UTC(calState.year, calState.month - 1, 1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(calState.year, calState.month, 0)).getUTCDate();

  const monthLabel = new Intl.DateTimeFormat('zh-Hant', {
    timeZone: TZ, year: 'numeric', month: 'long'
  }).format(new Date(Date.UTC(calState.year, calState.month - 1, 15)));

  let html = `
    <div class="legend">
      <span><i class="dot-yue"></i>李悅</span>
      <span><i class="dot-xin"></i>李昕</span>
    </div>
    <div class="cal-header">
      <h2>${monthLabel}</h2>
      <div class="cal-nav">
        <button type="button" id="calPrev" aria-label="上月">‹</button>
        <button type="button" id="calToday" aria-label="本月">今日</button>
        <button type="button" id="calNext" aria-label="下月">›</button>
      </div>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span>
      <span>四</span><span>五</span><span>六</span>
    </div>
    <div class="cal-grid">`;

  const gridStart = addDays(firstOfMonth, -startWeekday);
  for (let i = 0; i < 42; i++) {
    const cell = addDays(gridStart, i);
    const inMonth = cell.m === calState.month && cell.y === calState.year;
    const dayItems = byDate[cell.iso] || [];
    const isToday = cell.iso === today.iso;
    const isOverdue = cmpYmd(cell, today) < 0 && dayItems.length;
    const isSelected = calState.selected === cell.iso;
    const classes = ['cal-day'];
    if (!inMonth) classes.push('other-month');
    if (isToday) classes.push('today');
    if (isSelected) classes.push('selected');
    if (isOverdue) classes.push('overdue-day');

    const dots = dayItems.map(row => {
      const overdue = cmpYmd(row.due, today) < 0 && !store[row.key];
      return `<span class="cal-dot ${row.childClass}${overdue ? ' overdue' : ''}" title="${row.child.zh}"></span>`;
    }).join('');

    html += `<button type="button" class="${classes.join(' ')}" data-date="${cell.iso}" ${inMonth ? '' : 'tabindex="-1"'}>
      <span class="cal-day-num">${cell.d}</span>
      <span class="cal-dots">${dots}</span>
    </button>`;
  }
  html += '</div>';

  if (calState.selected && byDate[calState.selected]) {
    const selItems = byDate[calState.selected];
    const selOverdue = cmpYmd(parseYmd(calState.selected), today) < 0;
    html += `<div class="cal-day-detail">
      <h3>${calState.selected}${selOverdue ? ' <span class="cal-item-badge overdue">已逾期</span>' : ''}</h3>
      <ul>`;
    for (const row of selItems) {
      const done = !!store[row.key];
      const overdue = cmpYmd(row.due, today) < 0 && !done;
      html += `<li>
        <div class="cal-item-row">
          <span class="cal-item-badge ${row.childClass}">${row.child.zh}</span>
          ${overdue ? '<span class="cal-item-badge overdue">逾期</span>' : ''}
          ${done ? '<span class="pill">已完成</span>' : ''}
        </div>
        <div class="title" style="font-size:.85rem;margin-top:2px">${row.item.subject} · ${row.item.title}</div>
        <div class="row"><span>${row.sectionLabel}</span></div>
      </li>`;
    }
    html += '</ul><button type="button" class="primary" id="calJumpList" style="margin-top:8px">跳至待辦清單</button></div>';
  } else if (calState.selected) {
    html += `<div class="cal-day-detail"><div class="sub">此日無功課項目</div></div>`;
  }

  root.innerHTML = html;

  root.querySelector('#calPrev')?.addEventListener('click', () => {
    calState.month--;
    if (calState.month < 1) { calState.month = 12; calState.year--; }
    renderCalendar(data, loadStore());
  });
  root.querySelector('#calNext')?.addEventListener('click', () => {
    calState.month++;
    if (calState.month > 12) { calState.month = 1; calState.year++; }
    renderCalendar(data, loadStore());
  });
  root.querySelector('#calToday')?.addEventListener('click', () => {
    calState.year = today.y;
    calState.month = today.m;
    calState.selected = today.iso;
    renderCalendar(data, loadStore());
    highlightItemsForDate(today.iso);
  });
  root.querySelectorAll('.cal-day:not(.other-month)').forEach(btn => {
    btn.addEventListener('click', () => {
      calState.selected = btn.dataset.date;
      renderCalendar(data, loadStore());
      highlightItemsForDate(calState.selected);
    });
  });
  root.querySelector('#calJumpList')?.addEventListener('click', () => {
    highlightItemsForDate(calState.selected);
  });
}

function renderGantt(data, store) {
  const root = document.getElementById('gantt-root');
  const today = parseYmd(todayMacau());
  const allItems = collectAllItems(data)
    .filter(row => row.due && daysBetween(today, row.due) <= 120)
    .sort((a, b) => cmpYmd(a.due, b.due) || a.child.zh.localeCompare(b.child.zh, 'zh-Hant'));

  if (!allItems.length) {
    root.innerHTML = '<div class="gantt-empty">暫無可顯示的截止日期</div>';
    return;
  }

  let rangeStart = today;
  let rangeEnd = today;
  for (const row of allItems) {
    if (cmpYmd(row.due, rangeEnd) > 0) rangeEnd = row.due;
    if (cmpYmd(row.due, rangeStart) < 0) rangeStart = row.due;
  }
  const spanDays = Math.max(daysBetween(rangeStart, rangeEnd), 7);
  const totalDays = spanDays + 1;

  const axisCells = [];
  for (let i = 0; i <= spanDays; i++) {
    const d = addDays(rangeStart, i);
    axisCells.push(`<div class="gantt-axis-cell">${d.m}/${d.d}</div>`);
  }

  const todayOffset = Math.max(0, Math.min(spanDays, daysBetween(rangeStart, today)));
  const todayPct = (todayOffset / spanDays) * 100;

  let groupsHtml = '';
  for (const child of data.children || []) {
    const rows = allItems.filter(r => r.child.id === child.id);
    if (!rows.length) continue;
    const cls = CHILD_COLORS[child.id] || 'yue';
    groupsHtml += `<div class="gantt-group">
      <div class="gantt-group-title ${cls}">${child.zh}</div>`;
    for (const row of rows) {
      const done = !!store[row.key];
      const overdue = cmpYmd(row.due, today) < 0;
      let barStart, barEnd;
      if (overdue) {
        barEnd = row.due;
        barStart = addDays(row.due, -2);
        if (cmpYmd(barStart, rangeStart) < 0) barStart = rangeStart;
      } else {
        barStart = today;
        barEnd = row.due;
        if (cmpYmd(barStart, rangeStart) < 0) barStart = rangeStart;
      }
      const left = (daysBetween(rangeStart, barStart) / spanDays) * 100;
      const width = Math.max((daysBetween(barStart, barEnd) / spanDays) * 100, 1.5);
      const label = `${row.item.subject} · ${shortTitle(row.item)}`;
      groupsHtml += `
        <div class="gantt-row">
          <div class="gantt-label" title="${row.item.title}">${label}</div>
          <div class="gantt-track">
            <div class="gantt-bar ${cls}${overdue ? ' overdue' : ''}${done ? ' done' : ''}"
              style="left:${left}%;width:${width}%" title="${row.item.title}"></div>
          </div>
        </div>`;
    }
    groupsHtml += '</div>';
  }

  root.innerHTML = `
    <div class="legend">
      <span><i class="dot-yue"></i>李悅</span>
      <span><i class="dot-xin"></i>李昕</span>
      <span>藍線＝今天</span>
    </div>
    <div class="gantt-wrap">
      <div class="gantt">
        <div class="gantt-body">
          <div class="gantt-today-line" style="left:${todayPct}%">
            <span class="gantt-today-label">今日</span>
          </div>
          <div class="gantt-axis">${axisCells.join('')}</div>
          ${groupsHtml}
        </div>
      </div>
    </div>`;
}

function refreshViews(data) {
  const store = loadStore();
  renderCalendar(data, store);
  renderGantt(data, store);
}

function setupTabs() {
  const tabs = document.querySelectorAll('.view-tabs button');
  const panels = {
    calendar: document.getElementById('panel-calendar'),
    gantt: document.getElementById('panel-gantt')
  };
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.tab;
      tabs.forEach(t => {
        t.classList.toggle('active', t === btn);
        t.setAttribute('aria-selected', t === btn ? 'true' : 'false');
      });
      Object.entries(panels).forEach(([k, el]) => el.classList.toggle('active', k === id));
    });
  });
}

function childPageHref(id) {
  const page = id === 'li-xin' ? 'gloria.html' : 'abigail.html';
  try {
    const code = (localStorage.getItem('puiching-eclass-sync-code-v1') || '').trim();
    if (/^[A-Z2-9-]{20,24}$/i.test(code)) {
      return page + '?sync=' + encodeURIComponent(code.toUpperCase());
    }
  } catch (e) {}
  return page;
}

function updateChildLinks() {
  document.querySelectorAll('.child-link').forEach(a => {
    const isXin = a.classList.contains('xin') || (a.getAttribute('href') || '').includes('gloria');
    a.href = childPageHref(isXin ? 'li-xin' : 'li-yue');
  });
}

async function load() {
  const app = document.getElementById('app');
  const store = loadStore();
  try {
    const res = await fetch('status.json?ts=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    window.__DATA = data;
    const openToday = (data.children || []).map(c => {
      const n = (c.due_today || []).length;
      return c.zh + ' ' + n + ' 項';
    }).join(' · ');
    const updatedSub = document.getElementById('updated-text');
    const updateStr = formatUpdated(data.updated_at) + (openToday ? ' · 今日 ' + openToday : '');
    if (updatedSub) {
      updatedSub.textContent = updateStr;
    } else {
      document.getElementById('updated').innerHTML = '<span class="live-dot"></span>' + updateStr;
    }
    refreshViews(data);
    app.innerHTML = '';
    for (const child of data.children || []) {
      const card = document.createElement('section');
      card.className = 'card';
      card.dataset.childId = child.id;
      const { total, done } = childProgress(child, store);
      const pct = total ? Math.round(done * 100 / total) : 0;
      const pageCls = child.id === 'li-xin' ? 'xin' : 'yue';
      const avatar = child.id === 'li-xin' ? '🐰' : '<img src="assets/abigail_avatar.jpg" alt="🐶" style="width:24px;height:24px;border-radius:50%;vertical-align:middle;display:inline-block;margin-right:4px;object-fit:cover;" onerror="this.outerHTML=\'🐶\'">';
      card.innerHTML = `
        <div class="card-head">
          <h2>${avatar} ${child.zh} <span class="grade-badge" style="font-size:0.75rem;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,0.08);color:var(--muted)">${child.grade}</span></h2>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
            <button type="button" class="btnPairQr" data-child-id="${child.id}" style="font-size:0.76rem;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,0.08);border:1px solid var(--border);color:var(--text);cursor:pointer;">📱 配對平板</button>
            <a class="child-link ${pageCls}" href="${childPageHref(child.id)}">平板專屬頁 →</a>
          </div>
        </div>
        <div class="meta">
          <span><span class="doneCount">${done}</span>／${total} 項完成</span>
          <span class="pctCount" style="font-size:0.82rem;color:var(--muted);font-weight:700">${pct}%</span>
        </div>
        <div class="progress"><i style="width:${pct}%"></i></div>
        <div class="actions" style="margin:0 0 10px">
          <button class="ok btnChildClear" type="button">✨ 複製「${child.zh}清了」</button>
        </div>`;
      card.querySelector('.btnPairQr')?.addEventListener('click', () => {
        openPairModal(child.id);
      });
      const progressBar = card.querySelector('.progress > i');
      const doneCount = card.querySelector('.doneCount');
      const pctCount = card.querySelector('.pctCount');
      const refreshProg = () => {
        const s = loadStore();
        const p = childProgress(child, s);
        doneCount.textContent = p.done;
        const currentPct = p.total ? Math.round(p.done * 100 / p.total) : 0;
        progressBar.style.width = currentPct + '%';
        if (pctCount) pctCount.textContent = currentPct + '%';
        if (window.__DATA) refreshViews(window.__DATA);
      };
      const onToggle = (key, checked, li) => {
        const s = loadStore();
        if (checked) s[key] = true; else delete s[key];
        saveStore(s);
        li.classList.toggle('done', checked);
        refreshProg();
      };
      for (const [sec, label, items] of sectionItems(child)) {
        if (!items.length) continue;
        if (sec === 'other') {
          const det = document.createElement('details');
          det.className = 'more';
          const sum = document.createElement('summary');
          sum.textContent = '其他 ' + items.length + ' 項';
          det.appendChild(sum);
          const ul = document.createElement('ul');
          for (const it of items) ul.appendChild(renderItem(child.id, sec, it, store, onToggle).li);
          det.appendChild(ul);
          card.appendChild(det);
          continue;
        }
        const h = document.createElement('h3');
        h.textContent = label;
        card.appendChild(h);
        const ul = document.createElement('ul');
        for (const it of items) ul.appendChild(renderItem(child.id, sec, it, store, onToggle).li);
        card.appendChild(ul);
      }
      card.querySelector('.btnChildClear').addEventListener('click', async () => {
        const text = child.zh + '清了';
        await copyText(text);
        toast('已複製：' + text + ' — 貼給 Grok');
      });
      app.appendChild(card);
    }
  } catch (e) {
    app.innerHTML = `<div class="card">讀不到 status.json：${e.message}</div>`;
    document.getElementById('calendar-root').innerHTML = `<div class="sub">載入失敗</div>`;
    document.getElementById('gantt-root').innerHTML = `<div class="sub">載入失敗</div>`;
  }
}

document.getElementById('btnCopyAll').addEventListener('click', async () => {
  const data = window.__DATA; if (!data) return;
  const store = loadStore();
  const lines = [];
  for (const child of data.children || []) {
    if (isChildCleared(child, store)) lines.push(child.zh + '清了');
    else {
      const open = [];
      for (const it of [...(child.due_today || [])]) {
        if (!store[itemKey(child.id, 'due_today', it)]) open.push(it.title);
      }
      for (const it of [...(child.due_soon || [])]) {
        if (!store[itemKey(child.id, 'due_soon', it)]) open.push(it.title);
      }
      lines.push(child.zh + (open.length ? '未清：' + open.join('；') : '無今日項'));
    }
  }
  const text = lines.join('\n');
  await copyText(text);
  toast('已複製給 Grok');
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (!confirm('清除此瀏覽器全部勾選？連上雲端時也會同步清除。')) return;
  localStorage.removeItem(STORE_KEY);
  try { window.PuichingSync && window.PuichingSync.replaceTodos({}); } catch {}
  load();
  toast('已清除本機勾選');
});

let __syncReloadT = 0;
function queueSyncReload() {
  clearTimeout(__syncReloadT);
  __syncReloadT = setTimeout(() => { try { load(); } catch {} }, 400);
}
try {
  window.PuichingSync && window.PuichingSync.register({
    onTodosChanged: () => queueSyncReload(),
    onPointsChanged: (p) => { try { localStorage.setItem(POINTS_KEY, JSON.stringify(p || {})); } catch {} }
  });
} catch {}

function openPairModal(childId) {
  let normCode = '';
  if (window.PuichingSync && typeof window.PuichingSync.getOrCreateCode === 'function') {
    normCode = window.PuichingSync.getOrCreateCode();
  } else {
    const raw = (localStorage.getItem('puiching-eclass-sync-code-v1') || document.getElementById('sync-code')?.value || '').trim();
    normCode = raw.toUpperCase().replace(/[\s-]/g, '');
  }
  const page = (childId === 'li-xin') ? 'gloria.html' : 'abigail.html';
  const url = window.PuichingSync && window.PuichingSync.getChildPairingUrl
    ? window.PuichingSync.getChildPairingUrl(page, normCode)
    : ('https://samulee003.github.io/puiching-eclass-handoff/' + page + '?sync=' + normCode);

  const modal = document.getElementById('qrModal');
  const modalTitle = document.getElementById('qrModalTitle');
  const modalBox = document.getElementById('qrModalBox');
  const modalUrl = document.getElementById('qrModalUrl');
  const modalCode = document.getElementById('qrModalCode');
  const modalCopy = document.getElementById('qrModalCopy');
  const modalCopyCode = document.getElementById('qrModalCopyCode');
  const modalOpen = document.getElementById('qrModalOpen');

  if (modal && modalTitle && modalBox && modalUrl) {
    modalTitle.innerHTML = (childId === 'li-xin' ? '🐰 李昕' : '🐶 李悅') + ' 平板專屬配對';
    const svg = window.PuichingSync && window.PuichingSync.generateQrSvg
      ? window.PuichingSync.generateQrSvg(url, { size: 200, margin: 2 })
      : '';
    modalBox.innerHTML = svg;
    modalUrl.textContent = url;
    if (modalCode) {
      const formatted = (normCode.match(/.{1,4}/g) || []).join('-') || normCode;
      modalCode.textContent = formatted;
    }
    modal.style.display = 'flex';

    if (modalCopy) {
      modalCopy.onclick = async () => {
        await copyText(url);
        toast('已複製配對網址！');
      };
    }
    if (modalCopyCode) {
      modalCopyCode.onclick = async () => {
        await copyText(normCode);
        toast('已複製家庭同步碼！');
      };
    }
    if (modalOpen) {
      modalOpen.onclick = () => {
        window.open(url, '_blank');
      };
    }
  }
}

document.getElementById('qrModalClose')?.addEventListener('click', () => {
  const modal = document.getElementById('qrModal');
  if (modal) modal.style.display = 'none';
});
document.getElementById('qrModal')?.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'qrModal') {
    e.target.style.display = 'none';
  }
});

setupTabs();
load();
</script>
</body>
</html>
