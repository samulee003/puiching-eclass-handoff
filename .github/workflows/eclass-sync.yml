name: eClass Daily Homework Sync

on:
  schedule:
    # 平日（週一至週五）澳門時間 15:30 執行（UTC 07:30）
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    # 支援在 GitHub 網頁隨時手動點擊「Run workflow」測試執行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Scrape & update Abigail (李悅)
        env:
          ECLASS_USERNAME: ${{ secrets.ECLASS_USERNAME }}
          ECLASS_PASSWORD: ${{ secrets.ECLASS_PASSWORD }}
          ECLASS_LI_YUE_USERNAME: ${{ secrets.ECLASS_LI_YUE_USERNAME }}
          ECLASS_LI_YUE_PASSWORD: ${{ secrets.ECLASS_LI_YUE_PASSWORD }}
        run: |
          python3 scripts/update_status.py --child li-yue --scrape

      - name: Scrape & update Gloria (李昕)
        env:
          ECLASS_USERNAME: ${{ secrets.ECLASS_USERNAME }}
          ECLASS_PASSWORD: ${{ secrets.ECLASS_PASSWORD }}
          ECLASS_LI_XIN_USERNAME: ${{ secrets.ECLASS_LI_XIN_USERNAME }}
          ECLASS_LI_XIN_PASSWORD: ${{ secrets.ECLASS_LI_XIN_PASSWORD }}
        run: |
          python3 scripts/update_status.py --child li-xin --scrape

      - name: Validate status.json
        run: |
          python3 scripts/validate_status.py

      - name: Commit and push if status changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json DASHBOARD.md
          if git diff --staged --quiet; then
            echo "沒有新家課變更，無需提交。"
          else
            git commit -m "chore(auto-sync): update daily homework via eClass scraper"
            git push origin main
          fi
