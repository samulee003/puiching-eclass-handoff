name: Validate status.json

on:
  push:
    paths:
      - "status.json"
      - "schema/status.schema.json"
      - "scripts/validate_status.py"
      - ".github/workflows/validate-status.yml"
  pull_request:
    paths:
      - "status.json"
      - "schema/status.schema.json"
      - "scripts/validate_status.py"
      - ".github/workflows/validate-status.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate status.json against schema
        run: python scripts/validate_status.py
